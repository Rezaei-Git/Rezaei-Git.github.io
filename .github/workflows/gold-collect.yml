name: gold-collect
on:
  schedule:
    - cron: '*/30 * * * *'
  push:
    paths: ['gold/tools/scrape.py', '.github/workflows/gold-collect.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gold-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: gold, fetch-depth: 1 }
      - run: pip install -q requests
      - run: python3 gold/tools/scrape.py | tee gold/debug/last-run.json
      - name: commit
        run: |
          git config user.name "Gold Berlin bot"; git config user.email "a.rezaei.official@gmail.com"
          git add gold/data gold/data.json gold/debug/last-run.json
          git diff --cached --quiet && exit 0
          git commit -q -m "gold: collect $(date -u +%H:%M)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && exit 0; sleep 5; done; exit 1
