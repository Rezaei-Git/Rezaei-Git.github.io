name: gold-collect
# Collects prices every 30 minutes. One run loops for ~5.5 hours, so the app keeps
# updating even when GitHub's scheduler is late; the schedule starts the next loop.
on:
  schedule:
    - cron: '*/30 * * * *'
  push:
    paths: ['gold/tools/scrape.py', '.github/workflows/gold-collect.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gold-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: gold, fetch-depth: 1 }
      - run: pip install -q requests
      - name: collect loop
        run: |
          git config user.name "Gold Berlin bot"; git config user.email "a.rezaei.official@gmail.com"
          for i in $(seq 1 11); do
            git pull -q --rebase origin main || true
            python3 gold/tools/scrape.py | tee gold/debug/last-run.json || echo '{"error":"scrape crashed"}' > gold/debug/last-run.json
            git add gold/data gold/data.json gold/debug/last-run.json
            if ! git diff --cached --quiet; then
              git commit -q -m "gold: collect $(date -u +%H:%M)"
              for t in 1 2 3; do git pull -q --rebase origin main && git push -q && break; sleep 5; done
            fi
            [ "$i" -lt 11 ] && sleep 1740
          done
